<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .stream-container {
            border: 4px solid #14f3ff;
            border-radius: 8px;
            overflow: hidden;
            max-width: 90%;
            background: #000;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
        }
    </style>
</head>
<body>

    <h1>Podgląd na żywo</h1>
    <div class="stream-container">
        <img
            src="/api/stream.mjpeg?src=esp_cam"
            alt="Podgląd z kamery"
            id="camera">
    </div>
    <script>
        const camera = document.getElementById("camera");
        const streamUrl = "/api/stream.mjpeg?src=esp_cam";

        window.addEventListener("pagehide", () => {
                camera.removeAttribute("src");
        });

        window.addEventListener("pageshow", () => {
                camera.src = streamUrl;
        });
    </script>
</body>
</html>
