<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <section class="image-panel">
            <div class="img-container">
                <img
                src=""
                alt="Podgląd z kamery"
                id="cameraImage">
            </div>
        </section>
        
        <aside class="sidebar">
            <header class="panel-header">
                <h2>Panel sterowania kamery</h2>
                <div id="status" role="status" aria-live="polite"></div>
            </header>
            
            <details class="panel-section" open>
                <summary>Sterowanie</summary>
                <div class="controls">
                    <button class="btn" id="streamButton" type="button">Wyłącz stream</button>
                    <div class="rotation-buttons">
                        <button class="btn" id="rotateLeftButton" type="button">Obróć w lewo</button>
                        <button class="btn" id="rotateRightButton" type="button">Obróć w prawo</button>
                    </div>
                </div>
            </details>
            
            <details class="panel-section" open>
                <summary>Ustawienia kamery</summary>
                <div class="camera-settings">
                    <div class="setting" data-setting="brightness">
                        <span>Jasność: <output id="brightnessValue">2</output></span>
                        <div class="setting-controls">
                            <input class="setting-slider" id="brightnessInput" type="range" min="0" max="4" step="1">
                            <button class="btn setting-button" type="button" data-action="send">Wyślij</button>
                        </div>
                    </div>
                    <div class="setting" data-setting="contrast">
                        <span>Kontrast: <output id="contrastValue">2</output></span>
                        <div class="setting-controls">
                            <input class="setting-slider" id="contrastInput" type="range" min="0" max="4" step="1">
                            <button class="btn setting-button" type="button" data-action="send">Wyślij</button>
                        </div>
                    </div>
                    <div class="setting" data-setting="saturation">
                        <span>Nasycenie: <output id="saturationValue">2</output></span>
                        <div class="setting-controls">
                            <input class="setting-slider" id="saturationInput" type="range" min="0" max="4" step="1">
                            <button class="btn setting-button" type="button" data-action="send">Wyślij</button>
                        </div>
                    </div>
                    <div class="setting" data-setting="sharpness">
                        <span>Ostrość: <output id="sharpnessValue">2</output></span>
                        <div class="setting-controls">
                            <input class="setting-slider" id="sharpnessInput" type="range" min="0" max="4" step="1">
                            <button class="btn setting-button" type="button" data-action="send">Wyślij</button>
                        </div>
                    </div>
                    <div class="setting" data-setting="quality">
                        <span>Jakość: <output id="qualityValue">12</output></span>
                        <div class="setting-controls">
                            <input class="setting-slider" id="qualityInput" type="range" min="10" max="63" step="1">
                            <button class="btn setting-button" type="button" data-action="send">Wyślij</button>
                        </div>
                    </div>
                </div>
            </details>

            <details class="panel-section" open>
                <summary>Info</summary>
                <div class="temperature-info">
                    <p class="temp-status">Temperatura kamery: <span class="temperature-value" id="tempValue" aria-live="polite">--</span> °C</p>
                    <button class="btn temperature-button" id="tempButton" type="button"> &#8635; </button>
                </div>
            </details>
        </aside>
    </div>
    
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
