<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Podgląd Kamery - Działka</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <section class="image-panel">
      <div class="img-container">
        <img id="cameraImage" src="" alt="" />
      </div>
    </section>

    <aside class="sidebar">
      <header class="panel-header">
        <h2>Panel sterowania kamery</h2>
        <div id="status"></div>
      </header>

      <details class="panel-section" open>
        <summary>Sterowanie</summary>
        <div class="controls">
          <button class="btn capture" onclick="sendControl(appConfig.topics.capture, 'capture')">Zrób zdjęcie</button>
          <div class="rotation-buttons">
            <button class="btn" onclick="sendControl(appConfig.topics.rotateLeft, 'left')">Obróć w lewo</button>
            <button class="btn" onclick="sendControl(appConfig.topics.rotateRight, 'right')">Obróć w prawo</button>
          </div>
        </div>
      </details>

      <details class="panel-section" open>
        <summary>Ustawienia kamery</summary>
        <div class="camera-settings">
          <label class="setting">
            <span>Jasność: <output id="brightnessValue">2</output></span>
            <input id="brightness" type="range" min="0" max="4" step="1" value="2"
              oninput="updateSetting(this, appConfig.topics.brightness, 'brightnessValue')">
          </label>
          <label class="setting">
            <span>Kontrast: <output id="contrastValue">2</output></span>
            <input id="contrast" type="range" min="0" max="4" step="1" value="2"
              oninput="updateSetting(this, appConfig.topics.contrast, 'contrastValue')">
          </label>
          <label class="setting">
            <span>Nasycenie: <output id="saturationValue">2</output></span>
            <input id="saturation" type="range" min="0" max="4" step="1" value="2"
              oninput="updateSetting(this, appConfig.topics.saturation, 'saturationValue')">
          </label>
          <label class="setting">
            <span>Ostrość: <output id="sharpnessValue">2</output></span>
            <input id="sharpness" type="range" min="0" max="4" step="1" value="2"
              oninput="updateSetting(this, appConfig.topics.sharpness, 'sharpnessValue')">
          </label>
          <label class="setting">
            <span>Jakość: <output id="qualityValue">12</output></span>
            <input id="quality" type="range" min="10" max="63" step="1" value="12"
              oninput="updateSetting(this, appConfig.topics.quality, 'qualityValue')">
          </label>
        </div>
      </details>
    </aside>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
